{% extends "base.html" %}
{% block title %}Log in · SkillSwap{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4">
  <h1 class="h3 mb-3">Welcome back</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Log in</button></form>
  <p class="mt-3 mb-0 text-center">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div></div>
{% endblock %}
